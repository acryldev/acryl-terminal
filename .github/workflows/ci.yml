name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  check:
    name: check-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Enable Git longpaths
        shell: bash
        run: git config --global core.longpaths true
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@v5
        with: { node-version: 24, package-manager-cache: false }
      - name: Enable Corepack and the pnpm version the repository pins
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@$(grep '"packageManager"' package.json | grep -o '[0-9.]*' | head -1) --activate
      - run: corepack pnpm install --frozen-lockfile
      - name: Build, typecheck and test every package, then the release scripts' tests
        shell: bash
        run: corepack pnpm run check
